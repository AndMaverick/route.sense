[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "route.sense"
version = "0.1.0"
description = "A UCB1 router that learns which model earns its cost: quality minus weighted cost as reward, deterministic and dependency-free."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AndMaverick LLC" }]

[tool.setuptools.packages.find]
include = ["route_sense*"]
