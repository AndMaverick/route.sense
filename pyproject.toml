[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "route.sense"
version = "0.2.0"
description = "Model routing that learns which model earns its cost: UCB1, Thompson, cheapest-above-a-quality-floor, drift forgetting, circuit breakers, budgets, segment routing and offline evaluation from logs. Deterministic, dependency-free Python."
classifiers = ["Typing :: Typed", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
keywords = ["llm", "routing", "bandit", "cost", "model-selection"]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AndMaverick LLC" }]

[tool.setuptools.packages.find]
include = ["route_sense*"]

[tool.setuptools.package-data]
route_sense = ["py.typed"]

[project.scripts]
route-sense = "route_sense.cli:main"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["route_sense"]
